<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ostéo Savasta</title>
  <meta name="description" content="Application du cabinet d'ostéopathie de Chirens : rendez-vous, contact, étirements, diététique.">
  <!-- Couleur de la barre du navigateur sur mobile -->
  <meta name="theme-color" content="#41546e">
  <!-- Installation (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icones/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ostéo Savasta">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Journal des erreurs techniques : chargé avant tout le reste, pour noter aussi un démarrage raté -->
  <script src="assets/js/journal.js"></script>
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>


  <!-- Le contenu de chaque écran est inséré ici par assets/js/app.js -->
  <main id="contenu" class="contenu" tabindex="-1">
    <p class="chargement">Chargement…</p>
  </main>

  <footer class="pied">
    <p class="pied-liens">
      <a href="#confidentialite">Confidentialité</a> ·
      <a href="#mentions-legales">Mentions légales</a>
    </p>
  </footer>

  <!-- Menu fixe en bas de l'écran, facile à atteindre avec le pouce -->
  <nav class="menu" aria-label="Menu principal">
    <a href="#accueil" data-route="accueil">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Accueil
    </a>
    <!-- « Mon carnet » : listes de courses et recettes favorites ; affiché par app.js une fois validé -->
    <a href="#carnet" data-route="carnet" class="js-carnet" hidden>
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4h12v16H6zM6 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2M9 8h6M9 12h6"/></svg><span class="js-carnet-libelle">Carnet</span>
    </a>
    <!-- Lien rendez-vous : l'adresse est remplacée au chargement par celle de config/liens.json -->
    <a href="https://www.osteo-savasta.fr/prendre-rendez-vous" class="menu-rdv js-lien-rdv"
       target="_blank" rel="noopener">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Rendez-vous
    </a>
    <!-- Ouvre le panneau « Contacter le cabinet » (appel, WhatsApp, e-mail) -->
    <button type="button" data-ouvrir="renseignements">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5 5.5 15A8 8 0 1 1 21 12Z"/></svg>Contacter
    </button>
    <a href="#infos" data-route="infos">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Infos
    </a>
  </nav>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
